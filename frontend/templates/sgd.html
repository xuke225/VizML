            initializeCanvases() {
                Object.values(this.contexts).forEach((ctx, index) => {
                    const canvas = Object.values(this.canvases)[index];
                    this.clearCanvas(ctx, canvas);
                });
            }
            
            clearCanvas(ctx, canvas) {
                ctx.fillStyle = '#F8FAFD';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                ctx.strokeStyle = '#DCE4EE';
                ctx.lineWidth = 1;
                
                // 绘制网格线
                for (let x = 0; x <= canvas.width; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y <= canvas.height; y += 30) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                
                // 绘制坐标轴
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 2;
                
                // X轴
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2);
                ctx.lineTo(canvas.width, canvas.height / 2);
                ctx.stroke();
                
                // Y轴
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
            }
            
            async generateData() {
                try {
                    this.updateStatus(VizMLI18n.t('正在生成数据...'));
                    
                    const dataType = document.getElementById('dataType').value;
                    const sampleSize = parseInt(document.getElementById('sampleSize').value);
                    const noiseLevel = parseFloat(document.getElementById('noiseLevel').value);
                    
                    const config = {
                        type: 'regression',
                        shape: dataType,
                        n_samples: sampleSize,
                        noise: noiseLevel,
                        random_state: 42
                    };
                    
                    const result = await this.apiClient.generateData(config);
                    
                    if (result.status === 'success') {
                        this.currentSessionKey = result.session_key;
                        this.currentData = result.data;
                        
                        this.visualizeData();
                        this.updateTrainingControlState(this.trainingSession ? this.controlState : 'idle');
                        
                        this.updateStatus(VizMLI18n.t('✅ 数据生成完成，共 ') + (this.currentData.n_samples) + VizMLI18n.t(' 个样本'));
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    console.error(VizMLI18n.t('数据生成失败:'), error);
                    this.updateStatus(VizMLI18n.t('❌ 数据生成失败: ') + error.message);
                }
            }
            
            visualizeData() {
                if (!this.currentData) return;
                
                const ctx = this.contexts.data;
                const canvas = this.canvases.data;
                this.clearCanvas(ctx, canvas);
                
                const X = this.currentData.X;
                const y = this.currentData.y;
                
                // 计算数据范围
                const xMin = Math.min(...X.map(point => point[0]));
                const xMax = Math.max(...X.map(point => point[0]));
                const yMin = Math.min(...y);
                const yMax = Math.max(...y);
                
                const margin = 30;
                const width = canvas.width - 2 * margin;
                const height = canvas.height - 2 * margin;
                
                // 存储数据范围供后续使用
                this.dataRange = { xMin, xMax, yMin, yMax };
                
                // 绘制数据点
                ctx.fillStyle = '#45B7D1';
                X.forEach((point, i) => {
                    const x = margin + ((point[0] - xMin) / (xMax - xMin)) * width;
                    const y_coord = margin + (1 - (y[i] - yMin) / (yMax - yMin)) * height;
                    
                    ctx.beginPath();
                    ctx.arc(x, y_coord, 4, 0, Math.PI * 2);
                    ctx.fill();
                });
                
                this.updateDataLegend();
            }
            
            updateDataLegend() {
                const legend = document.getElementById('dataLegend');
                let legendHTML = '\n                    ' + '<div class="legend-item">' + '\n                        ' + '<div class="legend-color" style="background: #45B7D1">' + '</div>' + '\n                        ' + '<span>' + VizMLI18n.t('训练数据') + '</span>' + '\n                    ' + '</div>' + '\n                ';
                
                // 添加预测曲线图例
                Object.entries(this.trainingHistory).forEach(([optimizer, _]) => {
                    const color = this.optimizerColors[optimizer];
                    legendHTML += '\n                        ' + '<div class="legend-item">' + '\n                            <div class="legend-color" style="background: ' + (color) + '">' + '</div>' + '\n                            ' + '<span>' + (optimizer.toUpperCase()) + VizMLI18n.t(' 拟合') + '</span>' + '\n                        ' + '</div>' + '\n                    ';
                });
                
                legend.innerHTML = legendHTML;
            }
            
            async startTraining() {
                if (!this.currentSessionKey) {
                    alert(VizMLI18n.t('请先生成数据！'));
                    return;
                }
                
                try {
                    this.updateTrainingControlState('starting');
                    this.updateStatus(VizMLI18n.t('正在启动训练会话...'));
                    
                    // 获取模型配置
                    const modelType = document.getElementById('modelType').value;
                    const modelConfig = {
                        model_type: modelType
                    };
                    
                    // 添加模型特定参数
                    if (modelType === 'polynomial') {
                        const degreeSelect = document.getElementById('polynomialDegree');
                        if (degreeSelect) modelConfig.polynomial_degree = parseInt(degreeSelect.value);
                    }
                    
                    // 准备优化器配置
                    const optimizersConfig = {};
                    this.selectedOptimizers.forEach(opt => {
                        // 为不同的优化器设置适合的学习率
                        let adaptiveLearningRate = parseFloat(document.getElementById('learningRate').value);
                        
                        // Adam优化器通常需要更小的学习率
                        if (opt === 'adam') {
                            adaptiveLearningRate = Math.min(adaptiveLearningRate, 0.001);
                        }
                        
                        const config = {
                            learning_rate: adaptiveLearningRate,
                            ...modelConfig  // 将模型配置传递给每个优化器
                        };
                        
                        // 从独立的参数配置区域收集优化器特定参数
                        const optimizerParams = this.getOptimizerParams(opt);
                        optimizerParams.forEach(param => {
                            const paramId = `${opt}_${param.name}`;
                            const paramElement = document.getElementById(paramId);
                            if (paramElement) {
                                config[param.name] = parseFloat(paramElement.value);
                            }
                        });
                        
                        optimizersConfig[opt] = config;
                    });
                    
                    const sessionConfig = {
                        session_key: this.currentSessionKey,
                        optimizers_config: optimizersConfig,
                        params: {
                            test_size: 0.2,
                            scale_features: true,
                            ...modelConfig  // 将模型配置也传递到session level
                        }
                    };
                    
                    const response = await fetch('http://localhost:5432/api/sgd/start_training_session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(sessionConfig)
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        this.trainingSession = result.session_info;
                        this.currentEpoch = 0;
                        this.startTime = Date.now();
                        this.trainingHistory = {};
                        this.trainingRevision += 1;
                        this.isTraining = false;
                        this.isStepPending = false;
                        
                        this.updateStatus(VizMLI18n.t('✅ 训练会话已启动，正在开始训练...'));
                        this.updateTrainingControlState('paused');
                        
                        // 自动开始训练
                        setTimeout(() => {
                            this.playTraining();
                        }, 500); // 延迟500ms确保界面更新完成
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    console.error(VizMLI18n.t('启动训练会话失败:'), error);
                    this.updateTrainingControlState('idle');
                    this.updateStatus(VizMLI18n.t('❌ 启动训练失败: ') + error.message);
                }
            }
            
            updateTrainingControlState(state) {
                this.controlState = state;

                const buttons = {
                    play: document.getElementById('playBtn'),
                    pause: document.getElementById('pauseBtn'),
                    step: document.getElementById('stepBtn'),
                    reset: document.getElementById('resetBtn')
                };
                const enabledByState = {
                    idle: [],
                    starting: [],
                    running: ['pause', 'reset'],
                    paused: ['play', 'step', 'reset'],
                    stepping: [],
                    completed: ['reset']
                };
                const enabledControls = new Set(enabledByState[state] || []);

                Object.entries(buttons).forEach(([name, button]) => {
                    button.disabled = !enabledControls.has(name);
                    button.classList.toggle('is-active',
                        (name === 'play' && state === 'running') ||
                        (name === 'pause' && state === 'paused'));
                });

                buttons.play.setAttribute('aria-pressed', String(state === 'running'));
                buttons.pause.setAttribute('aria-pressed', String(state === 'paused'));

                const controls = document.querySelector('.play-controls');
                controls.dataset.state = state;

                const statusLabels = {
                    idle: VizMLI18n.t('待开始'),
                    starting: VizMLI18n.t('准备中'),
                    running: VizMLI18n.t('训练中'),
                    paused: VizMLI18n.t('已暂停'),
                    stepping: VizMLI18n.t('单步执行中'),
                    completed: VizMLI18n.t('训练完成')
                };
                document.getElementById('overallStatus').textContent = statusLabels[state] || VizMLI18n.t('待开始');

                const startButton = document.getElementById('startTrainingBtn');
                startButton.disabled = !this.currentSessionKey || state !== 'idle';
            }
            
            playTraining() {
                if (!this.trainingSession || this.isTraining || this.controlState === 'completed') return;
                
                this.isTraining = true;
                const speed = parseFloat(document.getElementById('speedSlider').value);
                const interval = 1000 / speed; // 转换为毫秒
                
                this.trainingTimer = setInterval(() => {
                    this.stepTraining();
                }, interval);
                
                this.updateTrainingControlState('running');
                this.updateStatus(VizMLI18n.t('🔄 训练进行中...'));
            }
            
            pauseTraining() {
                if (!this.trainingSession || this.controlState === 'completed') return;

                this.isTraining = false;
                if (this.trainingTimer) {
                    clearInterval(this.trainingTimer);
                    this.trainingTimer = null;
                }
                
                this.updateTrainingControlState('paused');
                this.updateStatus(VizMLI18n.t('⏸ 训练已暂停'));
            }
            
            async stepTraining() {
                if (!this.trainingSession || this.isStepPending || this.controlState === 'completed') return;

                const wasRunning = this.isTraining;
                const requestRevision = this.trainingRevision;
                this.isStepPending = true;
                if (!wasRunning) this.updateTrainingControlState('stepping');

                try {
                    const batchSize = document.getElementById('batchSize').value || null;
                    const config = {
                        session_key: this.currentSessionKey,
                        batch_size: batchSize ? parseInt(batchSize) : null
                    };
                    
                    const response = await fetch('http://localhost:5432/api/sgd/train_step', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    
                    const result = await response.json();
                    if (requestRevision !== this.trainingRevision || !this.trainingSession) return;
                    
                    if (result.status === 'success') {
                        this.currentEpoch = result.step_result.epoch;
                        
                        // 更新训练历史
                        Object.entries(result.step_result.results).forEach(([optimizer, data]) => {
                            if (!this.trainingHistory[optimizer]) {
                                this.trainingHistory[optimizer] = [];
                            }
                            this.trainingHistory[optimizer].push(data);
                        });
                        
                        // 更新可视化
                        this.updateVisualization();
                        this.updateMetrics(result.step_result.results);
                        
                        // 检查是否完成训练
                        const maxIter = parseInt(document.getElementById('maxIterations').value);
                        if (this.currentEpoch >= maxIter) {
                            this.isTraining = false;
                            if (this.trainingTimer) {
                                clearInterval(this.trainingTimer);
                                this.trainingTimer = null;
                            }
                            this.updateTrainingControlState('completed');
                            this.showTrainingCompletedSummary();
                        } else if (!wasRunning) {
                            this.updateTrainingControlState('paused');
                        }
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    if (requestRevision !== this.trainingRevision) return;
                    console.error(VizMLI18n.t('训练步骤失败:'), error);
                    this.isTraining = false;
                    if (this.trainingTimer) {
                        clearInterval(this.trainingTimer);
                        this.trainingTimer = null;
                    }
                    this.updateTrainingControlState('paused');
                    this.updateStatus(VizMLI18n.t('❌ 训练步骤失败: ') + error.message);
                } finally {
                    if (requestRevision === this.trainingRevision) {
                        this.isStepPending = false;
                        if (this.controlState === 'stepping') {
                            this.updateTrainingControlState('paused');
                        }
                    }
                }
            }
            
            updateVisualization() {
                this.drawLossHistory();
                this.drawParameterTrajectory();
                this.drawGradientInfo();
                
                // 如果有预测曲线数据，更新数据可视化
                this.updateDataVisualization();
            }
            
            drawLossHistory() {
                const ctx = this.contexts.loss;
                const canvas = this.canvases.loss;
                this.clearCanvas(ctx, canvas);
                
                if (Object.keys(this.trainingHistory).length === 0) return;
                
                const margin = 30;
                const width = canvas.width - 2 * margin;
                const height = canvas.height - 2 * margin;
                
                // 计算所有优化器的损失范围
                let allLosses = [];
                Object.values(this.trainingHistory).forEach(history => {
                    allLosses = allLosses.concat(history.map(h => h.loss));
                });
                
                const lossMin = Math.min(...allLosses);
                const lossMax = Math.max(...allLosses);
                const epochMax = Math.max(...Object.values(this.trainingHistory).map(h => h.length));
                
                // 绘制每个优化器的损失曲线
                Object.entries(this.trainingHistory).forEach(([optimizer, history]) => {
                    const color = this.optimizerColors[optimizer];
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;
                    
                    ctx.beginPath();
                    history.forEach((point, i) => {
                        const x = margin + (i / Math.max(epochMax - 1, 1)) * width;
                        const y = margin + (1 - (point.loss - lossMin) / Math.max(lossMax - lossMin, 1e-6)) * height;
                        
                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    ctx.stroke();
                });
                
                this.updateLossLegend();
            }
            
            updateLossLegend() {
                const legend = document.getElementById('lossLegend');
                legend.innerHTML = '';
                
                Object.entries(this.trainingHistory).forEach(([optimizer, _]) => {
                    const color = this.optimizerColors[optimizer];
                    legend.innerHTML += `
                        <div class="legend-item">
                            <div class="legend-color" style="background: ${color}"></div>
                            <span>${optimizer.toUpperCase()}</span>
                        </div>
                    `;
                });
            }
            
            drawParameterTrajectory() {
                const ctx = this.contexts.param;
                const canvas = this.canvases.param;
                this.clearCanvas(ctx, canvas);
                
                if (Object.keys(this.trainingHistory).length === 0) return;
                
                const margin = 30;
                const width = canvas.width - 2 * margin;
                const height = canvas.height - 2 * margin;
                
                // 收集所有优化器的权重历史
                const allWeights = [];
                const allBiases = [];
                
                Object.values(this.trainingHistory).forEach(history => {
                    history.forEach(entry => {
                        if (entry.weights) {
                            allWeights.push(...entry.weights);
                        }
                        if (entry.bias !== undefined) {
                            allBiases.push(entry.bias);
                        }
                    });
                });
                
                if (allWeights.length === 0 && allBiases.length === 0) return;
                
                // 计算参数范围
                const weightMin = allWeights.length > 0 ? Math.min(...allWeights) : 0;
                const weightMax = allWeights.length > 0 ? Math.max(...allWeights) : 0;
                const biasMin = allBiases.length > 0 ? Math.min(...allBiases) : 0;
                const biasMax = allBiases.length > 0 ? Math.max(...allBiases) : 0;
                
                // 绘制每个优化器的参数轨迹
                Object.entries(this.trainingHistory).forEach(([optimizer, history]) => {
                    const color = this.optimizerColors[optimizer];
                    ctx.strokeStyle = color;
                    ctx.fillStyle = color;
                    ctx.lineWidth = 2;
                    
                    // 绘制权重变化（如果是简单情况，只显示第一个权重）
                    if (history.length > 0 && history[0].weights && history[0].weights.length > 0) {
                        ctx.beginPath();
                        history.forEach((entry, i) => {
                            const epochX = margin + (i / Math.max(history.length - 1, 1)) * width;
                            const weight0 = entry.weights[0];
                            const weightY = margin + (1 - (weight0 - weightMin) / Math.max(weightMax - weightMin, 1e-6)) * height * 0.45;
                            
                            if (i === 0) {
                                ctx.moveTo(epochX, weightY);
                            } else {
                                ctx.lineTo(epochX, weightY);
                            }
                        });
                        ctx.stroke();
                        
                        // 标记当前点
                        if (history.length > 0) {
                            const lastEntry = history[history.length - 1];
                            const epochX = margin + ((history.length - 1) / Math.max(history.length - 1, 1)) * width;
                            const weight0 = lastEntry.weights[0];
                            const weightY = margin + (1 - (weight0 - weightMin) / Math.max(weightMax - weightMin, 1e-6)) * height * 0.45;
                            
                            ctx.beginPath();
                            ctx.arc(epochX, weightY, 4, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    
                    // 绘制偏置变化
                    if (history.length > 0 && history[0].bias !== undefined) {
                        ctx.strokeStyle = color;
                        ctx.globalAlpha = 0.7;
                        ctx.setLineDash([5, 5]);
                        
                        ctx.beginPath();
                        history.forEach((entry, i) => {
                            const epochX = margin + (i / Math.max(history.length - 1, 1)) * width;
                            const biasY = margin + height * 0.55 + (1 - (entry.bias - biasMin) / Math.max(biasMax - biasMin, 1e-6)) * height * 0.45;
                            
                            if (i === 0) {
                                ctx.moveTo(epochX, biasY);
                            } else {
                                ctx.lineTo(epochX, biasY);
                            }
                        });
                        ctx.stroke();
                        
                        ctx.globalAlpha = 1.0;
                        ctx.setLineDash([]);
                    }
                });
                
                // 添加标签
                ctx.fillStyle = '#6B7890';
                ctx.font = '12px Arial';
                ctx.fillText(VizMLI18n.t('权重'), margin + 5, margin + 15);
                ctx.fillText(VizMLI18n.t('偏置'), margin + 5, margin + height * 0.55 + 15);
                
                this.updateParameterLegend();
            }
            
            drawGradientInfo() {
                const ctx = this.contexts.gradient;
                const canvas = this.canvases.gradient;
                this.clearCanvas(ctx, canvas);
                
                if (Object.keys(this.trainingHistory).length === 0) return;
                
                const margin = 30;
                const width = canvas.width - 2 * margin;
                const height = canvas.height - 2 * margin;
                
                // 收集所有梯度范数数据
                const allGradientNorms = [];
                Object.values(this.trainingHistory).forEach(history => {
                    history.forEach(entry => {
                        if (entry.gradient_norm !== undefined) {
                            allGradientNorms.push(entry.gradient_norm);
                        }
                    });
                });
                
                if (allGradientNorms.length === 0) return;
                
                const gradientMin = Math.min(...allGradientNorms);
                const gradientMax = Math.max(...allGradientNorms);
                const maxEpoch = Math.max(...Object.values(this.trainingHistory).map(h => h.length));
                
                // 绘制每个优化器的梯度范数曲线
                Object.entries(this.trainingHistory).forEach(([optimizer, history]) => {
                    const color = this.optimizerColors[optimizer];
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    history.forEach((entry, i) => {
                        const x = margin + (i / Math.max(maxEpoch - 1, 1)) * width;
                        const y = margin + (1 - (entry.gradient_norm - gradientMin) / Math.max(gradientMax - gradientMin, 1e-6)) * height;
                        
                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    ctx.stroke();
                    
                    // 标记当前点
                    if (history.length > 0) {
                        ctx.fillStyle = color;
                        const lastEntry = history[history.length - 1];
                        const x = margin + ((history.length - 1) / Math.max(maxEpoch - 1, 1)) * width;
                        const y = margin + (1 - (lastEntry.gradient_norm - gradientMin) / Math.max(gradientMax - gradientMin, 1e-6)) * height;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                // 绘制网格和标签
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 1;
                ctx.font = '10px Arial';
                ctx.fillStyle = '#6B7890';
                
                // Y轴标签 (梯度范数)
                const yTicks = 5;
                for (let i = 0; i <= yTicks; i++) {
                    const y = margin + (i / yTicks) * height;
                    const value = gradientMax - (i / yTicks) * (gradientMax - gradientMin);
                    
                    ctx.beginPath();
                    ctx.moveTo(margin - 5, y);
                    ctx.lineTo(margin, y);
                    ctx.stroke();
                    
                    ctx.fillText(value.toExponential(1), margin - 40, y + 3);
                }
                
                // X轴标签 (训练轮次)
                const xTicks = 5;
                for (let i = 0; i <= xTicks; i++) {
                    const x = margin + (i / xTicks) * width;
                    const epoch = Math.round((i / xTicks) * maxEpoch);
                    
                    ctx.beginPath();
                    ctx.moveTo(x, margin + height);
                    ctx.lineTo(x, margin + height + 5);
                    ctx.stroke();
                    
                    ctx.fillText(epoch.toString(), x - 10, margin + height + 18);
                }
                
                // 标题
                ctx.fillStyle = '#172033';
                ctx.font = '12px Arial';
                ctx.fillText(VizMLI18n.t('梯度范数随训练轮次的变化'), margin + width/2 - 80, margin - 10);
                
                this.updateGradientLegend();
            }
            
            updateParameterLegend() {
                const legend = document.getElementById('paramLegend');
                let legendHTML = '';
                
                Object.entries(this.trainingHistory).forEach(([optimizer, _]) => {
                    const color = this.optimizerColors[optimizer];
                    legendHTML += `
                        <div class="legend-item">
                            <div class="legend-color" style="background: ${color}"></div>
                            <span>${optimizer.toUpperCase()}</span>
                        </div>
                    `;
                });
                
                legend.innerHTML = legendHTML;
            }
            
            updateGradientLegend() {
                const legend = document.getElementById('gradientLegend');
                let legendHTML = '';
                
                Object.entries(this.trainingHistory).forEach(([optimizer, _]) => {
                    const color = this.optimizerColors[optimizer];
                    legendHTML += `
                        <div class="legend-item">
                            <div class="legend-color" style="background: ${color}"></div>
                            <span>${optimizer.toUpperCase()}</span>
                        </div>
                    `;
                });
                
                legend.innerHTML = legendHTML;
            }
            
            updateDataVisualization() {
                // 重新绘制数据和当前的拟合线
                this.visualizeData();
                
                // 如果有训练状态，获取并绘制预测曲线
                if (this.trainingSession) {
                    this.drawPredictionCurves();
                }
            }
            
            async drawPredictionCurves() {
                try {
                    const response = await fetch('http://localhost:5432/api/sgd/get_training_state', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_key: this.currentSessionKey })
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success' && result.training_state.prediction_curves) {
                        const ctx = this.contexts.data;
                        const canvas = this.canvases.data;
                        const margin = 30;
                        const width = canvas.width - 2 * margin;
                        const height = canvas.height - 2 * margin;
                        
                        Object.entries(result.training_state.prediction_curves).forEach(([optimizer, curve]) => {
                            if (!curve) return;
                            
                            const color = this.optimizerColors[optimizer];
                            ctx.strokeStyle = color;
                            ctx.lineWidth = 2;
                            
                            ctx.beginPath();
                            curve.x.forEach((x_val, i) => {
                                const y_val = curve.y[i];
                                const x = margin + ((x_val - this.dataRange.xMin) / (this.dataRange.xMax - this.dataRange.xMin)) * width;
                                const y = margin + (1 - (y_val - this.dataRange.yMin) / (this.dataRange.yMax - this.dataRange.yMin)) * height;
                                
                                if (i === 0) {
                                    ctx.moveTo(x, y);
                                } else {
                                    ctx.lineTo(x, y);
                                }
                            });
                            ctx.stroke();
                        });
                        
                        this.updateDataLegend();
                    }
                } catch (error) {
                    console.error(VizMLI18n.t('获取训练状态失败:'), error);
                }
            }
            
            updateMetrics(results) {
                // 更新训练进度
                const maxIter = parseInt(document.getElementById('maxIterations').value);
                document.getElementById('epochProgress').textContent = `${this.currentEpoch}/${maxIter}`;
                
                // 更新训练时间
                const elapsedTime = (Date.now() - this.startTime) / 1000;
                document.getElementById('trainingTime').textContent = `${elapsedTime.toFixed(1)}s`;
                
                // 更新多优化器状态面板
                this.updateOptimizersStatusPanel(results);
                
                // 分析总体收敛状态
                this.analyzeOverallConvergence();
            }
            
            updateOptimizersStatusPanel(results) {
                const panel = document.getElementById('optimizersStatusPanel');
                
                // 如果是第一次创建面板，先初始化结构
                if (panel.children.length === 0) {
                    this.initializeOptimizersStatusPanel();
                }
                
                // 更新每个优化器的状态
                Object.entries(results).forEach(([optimizer, result]) => {
                    const row = document.getElementById(`optimizer-row-${optimizer}`);
                    if (row) {
                        // 更新指标
                        row.querySelector('.loss-value').textContent = result.loss.toFixed(6);
                        row.querySelector('.r2-value').textContent = result.r2.toFixed(4);
                        row.querySelector('.gradient-value').textContent = result.gradient_norm.toFixed(6);
                        
                        // 更新状态
                        const statusBadge = row.querySelector('.optimizer-status-badge');
                        const convergenceStatus = this.analyzeOptimizerConvergence(optimizer);
                        statusBadge.textContent = convergenceStatus.text;
                        statusBadge.className = `optimizer-status-badge ${convergenceStatus.class}`;
                    }
                });
            }
            
            initializeOptimizersStatusPanel() {
                const panel = document.getElementById('optimizersStatusPanel');
                panel.innerHTML = '';
                
                this.selectedOptimizers.forEach(optimizer => {
                    const color = this.optimizerColors[optimizer];
                    const row = document.createElement('div');
                    row.className = 'optimizer-status-row';
                    row.id = `optimizer-row-${optimizer}`;
                    
                    row.innerHTML = '\n                        ' + '<div class="optimizer-name-badge">' + '\n                            <div class="optimizer-color-dot" style="background-color: ' + (color) + '">' + '</div>' + '\n                            ' + '<span class="optimizer-name">' + (optimizer) + '</span>' + '\n                        ' + '</div>' + '\n                        ' + '<div class="optimizer-metrics">' + '\n                            ' + '<div class="status-item">' + '\n                                ' + '<span class="status-label">' + VizMLI18n.t('损失:') + '</span>' + '\n                                ' + '<span class="status-value loss-value">' + 'N/A' + '</span>' + '\n                            ' + '</div>' + '\n                            ' + '<div class="status-item">' + '\n                                ' + '<span class="status-label">' + 'R²:' + '</span>' + '\n                                ' + '<span class="status-value r2-value">' + 'N/A' + '</span>' + '\n                            ' + '</div>' + '\n                            ' + '<div class="status-item">' + '\n                                ' + '<span class="status-label">' + VizMLI18n.t('梯度:') + '</span>' + '\n                                ' + '<span class="status-value gradient-value">' + 'N/A' + '</span>' + '\n                            ' + '</div>' + '\n                            ' + '<span class="optimizer-status-badge status-waiting">' + VizMLI18n.t('待开始') + '</span>' + '\n                        ' + '</div>' + '\n                    ';
                    
                    panel.appendChild(row);
                });
            }
            
            analyzeOptimizerConvergence(optimizer) {
                const history = this.trainingHistory[optimizer];
                if (!history || history.length === 0) {
                    return { text: VizMLI18n.t('待开始'), class: 'status-waiting' };
                }
                
                if (history.length < 5) {
                    return { text: VizMLI18n.t('训练中'), class: 'status-training' };
                }
                
                // 检查最近几步的损失变化
                const recentLosses = history.slice(-5).map(h => h.loss);
                const lossChange = Math.abs(recentLosses[recentLosses.length - 1] - recentLosses[0]);
                
                if (lossChange < 1e-6) {
                    return { text: VizMLI18n.t('已收敛'), class: 'status-converged' };
                } else if (lossChange < 1e-4) {
                    return { text: VizMLI18n.t('接近收敛'), class: 'status-training' };
                } else {
                    return { text: VizMLI18n.t('优化中'), class: 'status-training' };
                }
            }
            
            analyzeOverallConvergence() {
                const statusElement = document.getElementById('overallStatus');
                
                if (Object.keys(this.trainingHistory).length === 0) {
                    statusElement.textContent = VizMLI18n.t('待开始');
                    return;
                }
                
                let convergedCount = 0;
                let trainingCount = 0;
                
                this.selectedOptimizers.forEach(optimizer => {
                    const status = this.analyzeOptimizerConvergence(optimizer);
                    if (status.class === 'status-converged') {
                        convergedCount++;
                    } else if (status.class === 'status-training') {
                        trainingCount++;
                    }
                });
                
                if (convergedCount === this.selectedOptimizers.length) {
                    statusElement.textContent = VizMLI18n.t('全部收敛');
                } else if (convergedCount > 0) {
                    statusElement.textContent = (convergedCount) + '/' + (this.selectedOptimizers.length) + VizMLI18n.t(' 已收敛');
                } else if (trainingCount > 0) {
                    statusElement.textContent = VizMLI18n.t('训练中');
                } else {
                    statusElement.textContent = VizMLI18n.t('待开始');
                }
            }
            
            showTrainingCompletedSummary() {
                // 更新总体状态为完成
                document.getElementById('overallStatus').textContent = VizMLI18n.t('训练完成');
                
                // 统计各优化器的最终状态
                let bestOptimizer = null;
                let bestR2 = -Infinity;
                let summary = [];
                
                this.selectedOptimizers.forEach(optimizer => {
                    const history = this.trainingHistory[optimizer];
                    if (history && history.length > 0) {
                        const finalMetrics = history[history.length - 1];
                        const convergenceStatus = this.analyzeOptimizerConvergence(optimizer);
                        
                        if (finalMetrics.r2 > bestR2) {
                            bestR2 = finalMetrics.r2;
                            bestOptimizer = optimizer;
                        }
                        
                        summary.push({
                            optimizer,
                            finalLoss: finalMetrics.loss,
                            finalR2: finalMetrics.r2,
                            status: convergenceStatus.text,
                            epochs: history.length
                        });
                    }
                });
                
                // 更新状态面板显示为最终状态
                this.selectedOptimizers.forEach(optimizer => {
                    const row = document.getElementById(`optimizer-row-${optimizer}`);
                    if (row) {
                        const statusBadge = row.querySelector('.optimizer-status-badge');
                        if (optimizer === bestOptimizer) {
                            statusBadge.textContent = VizMLI18n.t('🏆 最佳');
                            statusBadge.className = 'optimizer-status-badge status-converged';
                        } else {
                            const convergenceStatus = this.analyzeOptimizerConvergence(optimizer);
                            statusBadge.textContent = convergenceStatus.text;
                            statusBadge.className = `optimizer-status-badge ${convergenceStatus.class}`;
                        }
                    }
                });
                
                // 显示训练完成消息
                const completionMessage = bestOptimizer 
                    ? VizMLI18n.t('🎉 训练完成！最佳优化器: ') + (bestOptimizer.toUpperCase()) + ' (R² = ' + (bestR2.toFixed(4)) + ')'
                    : VizMLI18n.t('🎉 训练完成！');
                
                this.updateStatus(completionMessage);
                
                // 可选：显示详细总结（可以添加模态框或者其他UI组件）
                console.log(VizMLI18n.t('训练完成总结:'), summary);
            }
            
            resetTraining() {
                this.trainingRevision += 1;
                this.isTraining = false;
                this.isStepPending = false;
                if (this.trainingTimer) {
                    clearInterval(this.trainingTimer);
                    this.trainingTimer = null;
                }

                this.trainingSession = null;
                this.currentEpoch = 0;
                this.trainingHistory = {};
                this.startTime = null;
                
                // 重置界面
                this.initializeCanvases();
                if (this.currentData) {
                    this.visualizeData();
                }
                
                // 重置指标
                document.getElementById('epochProgress').textContent = '0/0';
                document.getElementById('trainingTime').textContent = '0s';
                document.getElementById('overallStatus').textContent = VizMLI18n.t('待开始');
                
                // 清空多优化器状态面板
                const panel = document.getElementById('optimizersStatusPanel');
                panel.innerHTML = '';
                
                this.updateTrainingControlState('idle');
                this.updateStatus(VizMLI18n.t('🔄 训练状态已重置'));
            }
            
            async compareOptimizers() {
                if (!this.currentSessionKey) {
                    alert(VizMLI18n.t('请先生成数据！'));
                    return;
                }
                
                try {
                    this.updateStatus(VizMLI18n.t('正在比较优化器性能...'));
                    
                    // 获取模型配置
                    const modelType = document.getElementById('modelType').value;
                    const modelConfig = {
                        model_type: modelType
                    };
                    
                    // 添加模型特定参数
                    if (modelType === 'polynomial') {
                        const degreeSelect = document.getElementById('polynomialDegree');
                        if (degreeSelect) modelConfig.polynomial_degree = parseInt(degreeSelect.value);
                    }
                    
                    const optimizersConfig = {};
                    this.selectedOptimizers.forEach(opt => {
                        const config = {
                            learning_rate: parseFloat(document.getElementById('learningRate').value),
                            ...modelConfig  // 将模型配置传递给每个优化器
                        };
                        
                        // 从独立的参数配置区域收集优化器特定参数
                        const optimizerParams = this.getOptimizerParams(opt);
                        optimizerParams.forEach(param => {
                            const paramId = `${opt}_${param.name}`;
                            const paramElement = document.getElementById(paramId);
                            if (paramElement) {
                                config[param.name] = parseFloat(paramElement.value);
                            }
                        });
                        
                        optimizersConfig[opt] = config;
                    });
                    
                    const config = {
                        session_key: this.currentSessionKey,
                        optimizers_config: optimizersConfig,
                        max_iter: parseInt(document.getElementById('maxIterations').value),
                        params: {
                            test_size: 0.2,
                            scale_features: true,
                            ...modelConfig  // 将模型配置也传递到session level
                        }
                    };
                    
                    const response = await fetch('http://localhost:5432/api/sgd/compare_optimizers', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        this.displayComparisonResults(result.comparison_result);
                        this.updateStatus(VizMLI18n.t('✅ 优化器性能比较完成'));
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    console.error(VizMLI18n.t('优化器比较失败:'), error);
                    this.updateStatus(VizMLI18n.t('❌ 优化器比较失败: ') + error.message);
                }
            }
            
            displayComparisonResults(comparisonResult) {
                // 更新训练历史以显示比较结果
                this.trainingHistory = {};
                const predictionCurves = {};
                
                Object.entries(comparisonResult.results).forEach(([optimizer, result]) => {
                    if (!result.error) {
                        this.trainingHistory[optimizer] = result.training_history;
                        
                        // 保存预测曲线数据
                        if (result.prediction_curve) {
                            predictionCurves[optimizer] = result.prediction_curve;
                        }
                    }
                });
                
                // 更新可视化
                this.updateVisualization();
                
                // 绘制比较结果的预测曲线
                this.drawComparisonPredictionCurves(predictionCurves);
                
                // 显示最佳优化器
                if (comparisonResult.best_optimizer) {
                    this.updateStatus(VizMLI18n.t('🏆 最佳优化器: ') + (comparisonResult.best_optimizer));
                }
            }
            
            drawComparisonPredictionCurves(predictionCurves) {
                if (!this.currentData || Object.keys(predictionCurves).length === 0) return;
                
                const ctx = this.contexts.data;
                const canvas = this.canvases.data;
                
                // 重新绘制数据点
                this.visualizeData();
                
                const margin = 30;
                const width = canvas.width - 2 * margin;
                const height = canvas.height - 2 * margin;
                
                // 绘制每个优化器的预测曲线
                Object.entries(predictionCurves).forEach(([optimizer, curve]) => {
                    if (!curve || !curve.x || !curve.y) return;
                    
                    const color = this.optimizerColors[optimizer];
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;  // 稍微粗一点以便区分
                    
                    ctx.beginPath();
                    curve.x.forEach((x_val, i) => {
                        const y_val = curve.y[i];
                        const x = margin + ((x_val - this.dataRange.xMin) / (this.dataRange.xMax - this.dataRange.xMin)) * width;
                        const y = margin + (1 - (y_val - this.dataRange.yMin) / (this.dataRange.yMax - this.dataRange.yMin)) * height;
                        
                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    ctx.stroke();
                });
                
                // 更新图例以包含预测曲线
                this.updateDataLegend();
            }
            
            updateStatus(message) {
                console.log(VizMLI18n.t('状态:'), message);
                // 可以在这里添加状态显示逻辑
            }
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new SGDVisualizationPlatform();
        });
    </script>
</body>
