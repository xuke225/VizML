<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神经网络可视化教具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4F46E5 0%, #7C6CE7 100%);
            min-height: 100vh;
            color: #172033;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .status-banner {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        .status-banner.connected {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-banner.disconnected {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .main-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .controls-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 2fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .control-group {
            background: #F8FAFD;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #E7EDF5;
        }

        .control-group h3 {
            margin-bottom: 15px;
            color: #44516A;
            font-size: 1.1rem;
        }

        .control-item {
            margin-bottom: 15px;
        }

        .control-item label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4F46E5;
            border-radius: 50%;
            cursor: pointer;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .dataset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dataset-btn, .action-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .dataset-btn {
            background: #E7EDF5;
            color: #44516A;
        }

        .dataset-btn.active {
            background: #4F46E5;
            color: white;
        }

        .action-btn {
            background: #0F9D8A;
            color: white;
            font-weight: bold;
        }

        .action-btn:hover {
            background: #0B7F71;
            transform: translateY(-2px);
        }

        .action-btn.stop {
            background: #C2415D;
        }

        .action-btn.stop:hover {
            background: #A9344D;
        }

        .visualization-area {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 30px;
            min-height: 500px;
        }

        .data-canvas, .network-canvas, .output-canvas {
            border: 2px solid #E7EDF5;
            border-radius: 10px;
            background: white;
        }

        .canvas-container {
            position: relative;
        }

        .canvas-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #44516A;
        }

        .network-layers {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 20px;
        }

        .layer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .neuron {
            width: 40px;
            height: 40px;
            background: #4F46E5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .neuron:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .connection {
            stroke: #adb5bd;
            stroke-width: 1;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .connection.strong {
            stroke: #4F46E5;
            stroke-width: 2;
            opacity: 1;
        }

        .network-canvas.training .connection {
            animation: connectionPulse 2s infinite;
        }

        @keyframes connectionPulse {
            0% { opacity: 0.6; stroke-width: 1; }
            50% { opacity: 1; stroke-width: 2; }
            100% { opacity: 0.6; stroke-width: 1; }
        }

        .stats-compact {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            justify-content: space-between;
        }

        .stat-item-compact {
            flex: 1;
            min-width: 0;
            text-align: center;
            padding: 4px 2px;
            background: #F8FAFD;
            border-radius: 3px;
            border: 1px solid #E7EDF5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 28px;
        }

        .stat-label {
            display: block;
            font-size: 9px;
            font-weight: bold;
            color: #44516A;
            margin-bottom: 1px;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stat-value {
            display: block;
            color: #4F46E5;
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
            white-space: nowrap;
        }

        .loss-chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .feature-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .feature-btn {
            padding: 8px 12px;
            border: 2px solid #E7EDF5;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 12px;
        }

        .feature-btn.active {
            border-color: #4F46E5;
            background: #4F46E5;
            color: white;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .training .neuron {
            animation: pulse 1s infinite;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #E7EDF5;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #4F46E5, #7C6CE7);
            transition: width 0.3s ease;
            width: 0%;
        }

        .export-btn {
            padding: 6px 10px;
            border: 1px solid #E7EDF5;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s ease;
            color: #44516A;
        }
        
        .export-btn:hover {
            background: #F8FAFD;
            border-color: #4F46E5;
            color: #4F46E5;
            transform: translateY(-1px);
        }
        
        .export-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 1200px) {
            .visualization-area {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .stats-panel {
                position: static;
                margin-top: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/design-system.css">
    <script defer src="/static/js/visualization-theme.js"></script>
    <script defer src="/static/js/ui-shell.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span class="nav-item-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 64 64" fill="none">
                    <defs>
                        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#EAF2F8"/>
                            <stop offset="100%" stop-color="#D6E4F0"/>
                        </linearGradient>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#aaa"/>
                        </filter>
                        <radialGradient id="inputGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#F1948A"/>
                            <stop offset="100%" stop-color="#A9344D"/>
                        </radialGradient>
                        <radialGradient id="hiddenGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#5DADE2"/>
                            <stop offset="100%" stop-color="#2B8AC6"/>
                        </radialGradient>
                        <radialGradient id="outputGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#58D68D"/>
                            <stop offset="100%" stop-color="#239B56"/>
                        </radialGradient>
                        <linearGradient id="connGrad1" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#F1948A"/>
                            <stop offset="100%" stop-color="#5DADE2"/>
                        </linearGradient>
                        <linearGradient id="connGrad2" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#5DADE2"/>
                            <stop offset="100%" stop-color="#58D68D"/>
                        </linearGradient>
                    </defs>
                    <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bgGrad)" stroke="#CCC" stroke-width="1.2" filter="url(#shadow)"/>
                    <circle cx="16" cy="20" r="2" fill="url(#inputGrad)" filter="url(#shadow)"/>
                    <circle cx="16" cy="32" r="2" fill="url(#inputGrad)" filter="url(#shadow)"/>
                    <circle cx="16" cy="44" r="2" fill="url(#inputGrad)" filter="url(#shadow)"/>
                    <circle cx="32" cy="16" r="2" fill="url(#hiddenGrad)" filter="url(#shadow)"/>
                    <circle cx="32" cy="28" r="2" fill="url(#hiddenGrad)" filter="url(#shadow)"/>
                    <circle cx="32" cy="40" r="2" fill="url(#hiddenGrad)" filter="url(#shadow)"/>
                    <circle cx="32" cy="52" r="2" fill="url(#hiddenGrad)" filter="url(#shadow)"/>
                    <circle cx="48" cy="28" r="2" fill="url(#outputGrad)" filter="url(#shadow)"/>
                    <circle cx="48" cy="44" r="2" fill="url(#outputGrad)" filter="url(#shadow)"/>
                    <line x1="16" y1="20" x2="32" y2="16" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="20" x2="32" y2="28" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="20" x2="32" y2="40" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="32" x2="32" y2="16" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="32" x2="32" y2="28" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="32" x2="32" y2="40" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="32" x2="32" y2="52" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="44" x2="32" y2="28" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="44" x2="32" y2="40" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="16" y1="44" x2="32" y2="52" stroke="url(#connGrad1)" stroke-width="0.9"/>
                    <line x1="32" y1="16" x2="48" y2="28" stroke="url(#connGrad2)" stroke-width="0.9"/>
                    <line x1="32" y1="28" x2="48" y2="28" stroke="url(#connGrad2)" stroke-width="0.9"/>
                    <line x1="32" y1="40" x2="48" y2="44" stroke="url(#connGrad2)" stroke-width="0.9"/>
                    <line x1="32" y1="52" x2="48" y2="44" stroke="url(#connGrad2)" stroke-width="0.9"/>
                </svg> 神经网络可视化工具</h1>
            <p>探索神经网络的奥秘</p>
        </div>

        <div class="main-container">
            <!-- 连接状态 -->
            <div id="statusBanner" class="status-banner disconnected">
                正在检查后端服务连接...
            </div>
            <div class="controls-panel">
                <!-- 数据集选择 -->
                <div class="control-group">
                    <h3>📊 数据集</h3>
                    <div class="control-item">
                        <label>数据集类型:</label>
                        <select id="datasetType">
                            <!-- 线性可分数据 -->
                            <optgroup label="🔵 线性可分数据">
                                <option value="linear_separable">简单线性可分</option>
                                <option value="make_blobs">聚类数据</option>
                            </optgroup>
                            <!-- 线性不可分数据 -->
                            <optgroup label="🔴 线性不可分数据">
                                <option value="make_circles">同心圆</option>
                                <option value="make_moons">月牙形</option>
                                <option value="xor">XOR模式</option>
                                <option value="spiral">双螺旋</option>
                                <option value="gaussian">高斯分布</option>
                                <option value="checkerboard">棋盘模式</option>
                                <option value="multi_cluster">多簇聚类</option>
                                <option value="imbalanced">不平衡数据</option>
                            </optgroup>
                            <!-- 真实数据集 -->
                            <optgroup label="🟢 真实数据集">
                                <option value="iris">鸢尾花数据</option>
                                <option value="wine">红酒数据</option>
                                <option value="breast_cancer">乳腺癌数据</option>
                                <option value="digits_2d">手写数字识别</option>
                                <option value="diabetes">糖尿病数据</option>
                            </optgroup>
                            <!-- 自定义数据集 -->
                            <optgroup label="⚙️ 自定义数据集">
                                <option value="custom">自定义数据集</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="control-item">
                        <label>样本数量</label>
                        <input type="number" id="sampleSize" min="100" max="1000" value="300" step="50">
                    </div>
                    <!-- 自定义数据集配置 -->
                    <div class="control-item" id="customDataConfig" style="display: none;">
                        <label>类别数量</label>
                        <select id="customClassCount">
                            <option value="2">2类</option>
                            <option value="3">3类</option>
                            <option value="4">4类</option>
                            <option value="5">5类</option>
                            <option value="6">6类</option>
                            <option value="7">7类</option>
                            <option value="8">8类</option>
                            <option value="9">9类</option>
                            <option value="10">10类</option>
                        </select>
                    </div>
                    <div class="control-item" id="customShapeConfig" style="display: none;">
                        <label>数据形状</label>
                        <select id="customShape">
                            <option value="blobs">高斯聚类</option>
                            <option value="circles">同心圆</option>
                            <option value="classification">随机分类</option>
                        </select>
                    </div>
                    <div class="control-item" style="display: flex; align-items: center; gap: 6px;">
                        <label>噪声水平</label>
                        <input type="range" id="noise" min="0" max="3.0" step="0.05" value="0.1">
                        <span id="noiseValue">0.1</span>
                    </div>
                    <div class="control-item">
                        <button class="action-btn" id="generateDataBtn" style="width: 100%; margin-top: 10px;"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 64 64" fill="none" style="display: inline-block; vertical-align: middle; margin-right: 5px;">
                            <defs>
                                <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#EAF2F8"/>
                                    <stop offset="100%" stop-color="#D6E4F0"/>
                                </linearGradient>
                                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#aaa"/>
                                </filter>
                                <radialGradient id="dataGrad" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stop-color="#2B8AC6"/>
                                    <stop offset="100%" stop-color="#5DADE2"/>
                                </radialGradient>
                            </defs>
                            <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bgGrad)" stroke="#CCC" stroke-width="1.2" filter="url(#shadow)"/>
                            <rect x="18" y="14" width="28" height="10" rx="2" ry="2" fill="#AED6F1" stroke="#555" stroke-width="1.2" filter="url(#shadow)"/>
                            <polygon points="46,14 52,19 46,24" fill="#2B8AC6" filter="url(#shadow)"/>
                            <circle cx="22" cy="19" r="1.6" fill="url(#dataGrad)" filter="url(#shadow)"/>
                            <circle cx="28" cy="19" r="1.6" fill="url(#dataGrad)" filter="url(#shadow)"/>
                            <circle cx="34" cy="19" r="1.6" fill="url(#dataGrad)" filter="url(#shadow)"/>
                            <circle cx="40" cy="19" r="1.6" fill="url(#dataGrad)" filter="url(#shadow)"/>
                            <line x1="52" y1="19" x2="56" y2="19" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
                            <defs>
                                <marker id="arrow" markerWidth="4" markerHeight="4" refX="4" refY="2" orient="auto" markerUnits="strokeWidth">
                                    <path d="M0,0 L4,2 L0,4 L1,2 Z" fill="#555"/>
                                </marker>
                            </defs>
                        </svg> 生成数据</button>
                    </div>
                    <!-- 数据显示模式控制 -->
                    <div class="control-item" style="border-top: 1px solid #E7EDF5; padding-top: 12px; margin-top: 10px;">
                        <div style="display: flex; flex-direction: row; gap: 6px;">
                            <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                <input type="radio" name="dataDisplay" id="showAllData" value="all" checked style="margin: 0;"> 
                                <span>显示所有数据</span>
                            </label>
                            <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                <input type="radio" name="dataDisplay" id="showTrainData" value="train" style="margin: 0;"> 
                                <span>仅显示训练集</span>
                            </label>
                            <label style="font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                <input type="radio" name="dataDisplay" id="showTestData" value="test" style="margin: 0;"> 
                                <span>仅显示测试集</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 网络架构 -->
                <div class="control-group">
                    <h3>🏗️ 网络架构</h3>
                    <div class="control-item">
                        <label>网络类型</label>
                        <select id="networkType">
                            <option value="perceptron">单层感知机</option>
                            <option value="mlp" selected>多层感知机</option>
                        </select>
                    </div>
                    <div class="control-item" id="hiddenLayersConfig">
                        <label>隐藏层配置</label>
                        <select id="hiddenLayers">
                            <option value="50">单层 (50,)</option>
                            <option value="100,50" selected>双层 (100,50)</option>
                            <option value="100,100,50">三层 (100,100,50)</option>
                            <option value="100,100,100,100,50">五层(100,100,100,100,50)</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="control-item" id="customLayersConfig" style="display: none;">
                        <label>自定义隐藏层 (逗号分隔)</label>
                        <input type="text" id="customLayers" placeholder="64,32,16" value="64,32">
                    </div>
                    <div class="control-item">
                        <label>激活函数</label>
                        <select id="activation">
                            <option value="relu" selected>ReLU</option>
                            <option value="tanh">Tanh</option>
                            <option value="logistic">Sigmoid</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label>求解器</label>
                        <select id="solver">
                            <option value="adam" selected>Adam</option>
                            <option value="sgd">SGD</option>
                            <option value="lbfgs">L-BFGS</option>
                        </select>
                    </div>
                </div>

                <!-- 训练参数 -->
                <div class="control-group">
                    <h3>⚙️ 训练参数</h3>
                    <div class="control-item">
                        <label>学习率</label>
                        <input type="range" id="learningRate" min="0.0001" max="0.1" step="0.0001" value="0.001">
                        <span id="learningRateValue">0.001</span>
                    </div>
                    <div class="control-item">
                        <label>最大迭代次数</label>
                        <input type="number" id="maxIter" min="100" max="2000" value="500" step="100">
                    </div>
                    <div class="control-item">
                        <label>正则化强度 (alpha)</label>
                        <input type="range" id="alpha" min="0.0001" max="1" step="0.0001" value="0.0001">
                        <span id="alphaValue">0.0001</span>
                    </div>
                    <div class="control-item">
                        <!-- <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                            <button class="action-btn" id="realtimeTrainBtn" disabled style="width: 100%; background: #0F9D8A; font-size: 14px;">⚡ 实时训练</button>
                            <button class="action-btn stop" id="stopTrainBtn" disabled style="width: 100%; font-size: 13px;">⏹️ 停止训练</button>
                            <button class="action-btn" id="resetBtn" style="width: 100%;">🔄 重置</button>
                        </div> -->
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">

    <script>
        // 神经网络可视化教具 JavaScript 代码 - sklearn版本
        class NeuralNetworkPlayground {
            constructor() {
                // API客户端
                this.apiClient = new MLApiClient();
                
                // 当前会话和模型
                this.currentSessionKey = null;
                this.currentModelKey = null;
                this.currentData = null;
                this.mlpModel = null;
                
                // 训练状态
                this.isTraining = false;
                this.isRealtimeTraining = false;
                this.realtimeStep = 0;
                this.realtimeInterval = null;
                this.epoch = 0;
                this.loss = 0;
                this.accuracy = 0;
                this.testLoss = 0;
                
                // 网络参数 (sklearn MLPClassifier)
                this.networkConfig = {
                    network_type: 'mlp',
                    hidden_layer_sizes: '100,50',
                    activation: 'relu',
                    solver: 'adam',
                    learning_rate_init: 0.001,
                    max_iter: 500,
                    alpha: 0.0001
                };
                
                // 可视化选项
                this.dataDisplayMode = 'all'; // 'all', 'train', 'test'
                this.trainingHistory = [];
                this.boundaryAnimation = null;
                
                // 数据集参数
                this.datasetConfig = {
                    type: 'linear_separable',
                    n_samples: 300,
                    noise: 0.1,
                    customClassCount: 2,
                    customShape: 'blobs'
                };
                
                // 画布
                this.dataCanvas = null;
                this.outputCanvas = null;
                this.dataCtx = null;
                this.outputCtx = null;
                
                // 全站共享的色盲友好分类色板
                this.colors = window.VizTheme ? [...VizTheme.palette] : [
                    '#4F46E5', '#0F9D8A', '#E07A3F', '#D64C7F', '#2B8AC6',
                    '#7C6CE7', '#7B8F31', '#C15FBC', '#586779', '#D99A20'
                ];
                
                this.initializeEventListeners();
                this.initializeCanvases();
                this.checkBackendConnection();
                this.drawNetwork();
            }
            
            // 检查后端连接
            async checkBackendConnection() {
                const statusBanner = document.getElementById('statusBanner');
                
                try {
                    const isConnected = await this.apiClient.checkConnection();
                    
                    if (isConnected) {
                        statusBanner.textContent = '✅ 后端服务已连接 - 基于sklearn MLPClassifier的神经网络实现';
                        statusBanner.className = 'status-banner connected';
                    } else {
                        throw new Error('连接失败');
                    }
                } catch (error) {
                    statusBanner.textContent = '❌ 后端服务未连接 - 请启动Flask服务器 (python start.py)';
                    statusBanner.className = 'status-banner disconnected';
                    console.warn('后端服务连接失败:', error);
                }
            }
            
            // 初始化画布
            initializeCanvases() {
                this.dataCanvas = document.getElementById('dataCanvas');
                this.outputCanvas = document.getElementById('outputCanvas');
                this.dataCtx = this.dataCanvas.getContext('2d');
                this.outputCtx = this.outputCanvas.getContext('2d');
                
                this.clearCanvas(this.dataCtx, this.dataCanvas);
                this.clearCanvas(this.outputCtx, this.outputCanvas);
            }
            
            initializeEventListeners() {
                // 数据集选择
                document.getElementById('datasetType').addEventListener('change', (e) => {
                    this.datasetConfig.type = e.target.value;
                    
                    // 显示/隐藏自定义数据集配置
                    const customDataConfig = document.getElementById('customDataConfig');
                    const customShapeConfig = document.getElementById('customShapeConfig');
                    if (e.target.value === 'custom') {
                        customDataConfig.style.display = 'block';
                        customShapeConfig.style.display = 'block';
                    } else {
                        customDataConfig.style.display = 'none';
                        customShapeConfig.style.display = 'none';
                    }
                });
                
                document.getElementById('sampleSize').addEventListener('input', (e) => {
                    this.datasetConfig.n_samples = parseInt(e.target.value);
                });
                
                // 自定义数据集配置
                document.getElementById('customClassCount').addEventListener('change', (e) => {
                    this.datasetConfig.customClassCount = parseInt(e.target.value);
                });
                
                document.getElementById('customShape').addEventListener('change', (e) => {
                    this.datasetConfig.customShape = e.target.value;
                });
                
                // 噪声参数
                document.getElementById('noise').addEventListener('input', (e) => {
                    this.datasetConfig.noise = parseFloat(e.target.value);
                    document.getElementById('noiseValue').textContent = e.target.value;
                });
                
                // 网络架构
                document.getElementById('networkType').addEventListener('change', (e) => {
                    this.networkConfig.network_type = e.target.value;
                    const hiddenLayersConfig = document.getElementById('hiddenLayersConfig');
                    
                    if (e.target.value === 'perceptron') {
                        hiddenLayersConfig.style.display = 'none';
                        this.networkConfig.hidden_layer_sizes = '';
                    } else {
                        hiddenLayersConfig.style.display = 'block';
                        this.networkConfig.hidden_layer_sizes = document.getElementById('hiddenLayers').value;
                    }
                    this.drawNetwork();
                });
                
                document.getElementById('hiddenLayers').addEventListener('change', (e) => {
                    if (e.target.value === 'custom') {
                        document.getElementById('customLayersConfig').style.display = 'block';
                        this.networkConfig.hidden_layer_sizes = document.getElementById('customLayers').value;
                    } else {
                        document.getElementById('customLayersConfig').style.display = 'none';
                        this.networkConfig.hidden_layer_sizes = e.target.value;
                    }
                    this.drawNetwork();
                });
                
                document.getElementById('customLayers').addEventListener('input', (e) => {
                    this.networkConfig.hidden_layer_sizes = e.target.value;
                    this.drawNetwork();
                });
                
                document.getElementById('activation').addEventListener('change', (e) => {
                    this.networkConfig.activation = e.target.value;
                });
                
                document.getElementById('solver').addEventListener('change', (e) => {
                    this.networkConfig.solver = e.target.value;
                });
                
                // 训练参数
                document.getElementById('learningRate').addEventListener('input', (e) => {
                    this.networkConfig.learning_rate_init = parseFloat(e.target.value);
                    document.getElementById('learningRateValue').textContent = e.target.value;
                });
                
                document.getElementById('maxIter').addEventListener('input', (e) => {
                    this.networkConfig.max_iter = parseInt(e.target.value);
                });
                
                document.getElementById('alpha').addEventListener('input', (e) => {
                    this.networkConfig.alpha = parseFloat(e.target.value);
                    document.getElementById('alphaValue').textContent = e.target.value;
                });
                
                // 控制按钮
                document.getElementById('generateDataBtn').addEventListener('click', () => {
                    this.generateData();
                });
                
                
                document.getElementById('realtimeTrainBtn').addEventListener('click', () => {
                    this.startRealtimeTraining();
                });
                
                document.getElementById('stopTrainBtn').addEventListener('click', () => {
                    this.stopRealtimeTraining();
                });
                
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetAll();
                });
                
                // 数据显示选项
                const dataDisplayOptions = document.querySelectorAll('input[name="dataDisplay"]');
                dataDisplayOptions.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        this.dataDisplayMode = e.target.value;
                        console.log('数据显示模式切换到:', this.dataDisplayMode);
                        
                        // 重新绘制数据分布
                        if (this.currentData) {
                            this.visualizeData();
                        }
                        
                        // 重新绘制决策边界（包含数据点）
                        if (this.currentModelKey) {
                            this.visualizeDecisionBoundary();
                        }
                    });
                });
                
                // 导出功能按钮
                document.getElementById('exportImageBtn').addEventListener('click', () => {
                    this.exportDecisionBoundaryImage();
                });
                
                document.getElementById('exportDataBtn').addEventListener('click', () => {
                    this.exportTrainingData();
                });
                
                document.getElementById('exportHistoryBtn').addEventListener('click', () => {
                    this.exportTrainingHistory();
                });
                
                document.getElementById('exportModelBtn').addEventListener('click', () => {
                    this.exportModelInfo();
                });
                
            }
            
            // 生成数据
            async generateData() {
                try {
                    this.updateStatus('正在生成数据...');
                    
                    let shape = this.datasetConfig.type;
                    let additionalParams = {};
                    
                    // 处理自定义数据集
                    if (this.datasetConfig.type === 'custom') {
                        shape = this.datasetConfig.customShape;
                        additionalParams.n_classes = this.datasetConfig.customClassCount;
                    }
                    
                    const config = {
                        type: 'classification',
                        shape: shape,
                        n_samples: this.datasetConfig.n_samples,
                        noise: this.datasetConfig.noise,
                        random_state: 42,
                        ...additionalParams
                    };
                    
                    const result = await this.apiClient.generateData(config);
                    
                    if (result.status === 'success') {
                        this.currentSessionKey = result.session_key;
                        this.currentData = result.data;
                        
                        // 可视化数据
                        this.visualizeData();
                        
                        // 显示类别图例
                        this.showDataLegend();
                        
                        // 重新绘制网络结构（输出层可能根据类别数变化）
                        this.drawNetwork();
                        
                        // 启用训练按钮
                        document.getElementById('realtimeTrainBtn').disabled = false;
                        
                        this.updateStatus('数据生成完成，共 ' + this.currentData.n_samples + ' 个样本');
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    console.error('数据生成失败:', error);
                    this.updateStatus('数据生成失败: ' + error.message);
                }
            }
            
            // 可视化数据
            visualizeData() {
                if (!this.currentData || !this.currentData.X) return;
                
                this.clearCanvas(this.dataCtx, this.dataCanvas);
                
                const X = this.currentData.X;
                const y = this.currentData.y;
                
                // 计算数据范围
                const xMin = Math.min(...X.map(point => point[0]));
                const xMax = Math.max(...X.map(point => point[0]));
                const yMin = Math.min(...X.map(point => point[1]));
                const yMax = Math.max(...X.map(point => point[1]));
                
                // 存储数据范围
                this.dataRange = { xMin, xMax, yMin, yMax };
                
                // 如果有训练/测试分割信息，分别绘制
                if (this.trainTestInfo && this.trainTestInfo.X_train) {
                    this.drawTrainTestData();
                } else {
                    // 绘制所有数据点
                    this.drawAllData(X, y, xMin, xMax, yMin, yMax);
                }
            }
            
            // 绘制所有数据（未分割时）
            drawAllData(X, y, xMin, xMax, yMin, yMax) {
                X.forEach((point, i) => {
                    const x = ((point[0] - xMin) / (xMax - xMin)) * (this.dataCanvas.width - 40) + 20;
                    const y_coord = ((point[1] - yMin) / (yMax - yMin)) * (this.dataCanvas.height - 40) + 20;
                    
                    const label = y[i];
                    const colorIndex = label % this.colors.length;
                    
                    this.dataCtx.beginPath();
                    this.dataCtx.arc(x, y_coord, 5, 0, Math.PI * 2);
                    this.dataCtx.fillStyle = this.colors[colorIndex];
                    this.dataCtx.fill();
                    this.dataCtx.strokeStyle = '#172033';
                    this.dataCtx.lineWidth = 1;
                    this.dataCtx.stroke();
                });
            }
            
            // 绘制训练/测试数据（分割后）
            drawTrainTestData() {
                const { xMin, xMax, yMin, yMax } = this.dataRange;
                
                // 根据显示模式决定绘制哪些数据
                const shouldShowTrain = this.dataDisplayMode === 'all' || this.dataDisplayMode === 'train';
                const shouldShowTest = this.dataDisplayMode === 'all' || this.dataDisplayMode === 'test';
                
                // 绘制训练数据
                if (shouldShowTrain && this.trainTestInfo.X_train) {
                    this.trainTestInfo.X_train.forEach((point, i) => {
                        const x = ((point[0] - xMin) / (xMax - xMin)) * (this.dataCanvas.width - 40) + 20;
                        const y_coord = ((point[1] - yMin) / (yMax - yMin)) * (this.dataCanvas.height - 40) + 20;
                        
                        const label = this.trainTestInfo.y_train[i];
                        const colorIndex = label % this.colors.length;
                        
                        this.dataCtx.beginPath();
                        this.dataCtx.arc(x, y_coord, 6, 0, Math.PI * 2);
                        
                        // 训练集：实心圆，粗边框
                        this.dataCtx.fillStyle = this.colors[colorIndex];
                        this.dataCtx.fill();
                        this.dataCtx.strokeStyle = '#172033';
                        this.dataCtx.lineWidth = 2;
                        this.dataCtx.stroke();
                    });
                }
                
                // 绘制测试数据
                if (shouldShowTest && this.trainTestInfo.X_test) {
                    this.trainTestInfo.X_test.forEach((point, i) => {
                        const x = ((point[0] - xMin) / (xMax - xMin)) * (this.dataCanvas.width - 40) + 20;
                        const y_coord = ((point[1] - yMin) / (yMax - yMin)) * (this.dataCanvas.height - 40) + 20;
                        
                        const label = this.trainTestInfo.y_test[i];
                        const colorIndex = label % this.colors.length;
                        
                        this.dataCtx.beginPath();
                        this.dataCtx.arc(x, y_coord, 4, 0, Math.PI * 2);
                        
                        // 测试集：空心圆，细边框
                        this.dataCtx.fillStyle = 'white';
                        this.dataCtx.fill();
                        this.dataCtx.strokeStyle = this.colors[colorIndex];
                        this.dataCtx.lineWidth = 2;
                        this.dataCtx.stroke();
                    });
                }
            }
            
            // 颜色调亮函数
            lightenColor(color, factor) {
                // 简单的颜色调亮方法
                const hex = color.replace('#', '');
                const r = parseInt(hex.substr(0, 2), 16);
                const g = parseInt(hex.substr(2, 2), 16);
                const b = parseInt(hex.substr(4, 2), 16);
                
                const newR = Math.min(255, Math.floor(r + (255 - r) * factor));
                const newG = Math.min(255, Math.floor(g + (255 - g) * factor));
                const newB = Math.min(255, Math.floor(b + (255 - b) * factor));
                
                return `rgb(${newR}, ${newG}, ${newB})`;
            }
            
            
            
            // 更新训练统计
            updateTrainingStats(results) {
                // 获取最后一次的统计结果
                const lastHistory = this.trainingHistory[this.trainingHistory.length - 1];
                
                if (lastHistory) {
                    document.getElementById('epochValue').textContent = lastHistory.iteration || this.networkConfig.max_iter;
                    document.getElementById('lossValue').textContent = (lastHistory.train_loss || 0).toFixed(3);
                    document.getElementById('accuracyValue').textContent = ((lastHistory.train_accuracy || 0) * 100).toFixed(1) + '%';
                    document.getElementById('testLossValue').textContent = (lastHistory.test_loss || 0).toFixed(3);
                    document.getElementById('testAccuracyValue').textContent = ((lastHistory.test_accuracy || 0) * 100).toFixed(1) + '%';
                } else {
                    // 后备显示
                    const metrics = results.metrics || {};
                    document.getElementById('epochValue').textContent = this.networkConfig.max_iter;
                    document.getElementById('lossValue').textContent = (metrics.train_loss || 0).toFixed(3);
                    document.getElementById('accuracyValue').textContent = ((metrics.train_accuracy || 0) * 100).toFixed(1) + '%';
                    document.getElementById('testLossValue').textContent = (metrics.test_loss || 0).toFixed(3);

                    const boundaryData = await this.apiClient.getDecisionBoundary({

                    });
                    
                    if (boundaryData.status === 'success') {

                        this.drawSimulatedDecisionBoundary();

            // 绘制真实的决策边界
            drawDecisionBoundary(boundary) {
                this.clearCanvas(this.outputCtx, this.outputCanvas);
                
                const opacity = 0.6;
                const xx = boundary.xx;
                const yy = boundary.yy;
                const predictions = boundary.predictions;
                
                // 绘制决策边界
                for (let i = 0; i < xx.length; i++) {
                    for (let j = 0; j < xx[i].length; j++) {
                        const prediction = predictions[i][j];
                        const x = (j / xx[i].length) * this.outputCanvas.width;
                        const y = (i / xx.length) * this.outputCanvas.height;
                        
                        // 根据预测结果选择颜色
                        const colorIndex = prediction % this.colors.length;
                        const color = this.hexToRgb(this.colors[colorIndex]);
                        
                        this.outputCtx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${opacity})`;
                        this.outputCtx.fillRect(x, y, 
                            this.outputCanvas.width / xx[i].length + 1, 
                            this.outputCanvas.height / xx.length + 1);
                    }
                }
                
                // 重新绘制数据点
                this.redrawDataPoints();
            }
            
            // 绘制模拟决策边界（后备方案）
            drawSimulatedDecisionBoundary() {
                this.clearCanvas(this.outputCtx, this.outputCanvas);
                
                const { xMin, xMax, yMin, yMax } = this.dataRange;
                const resolution = 50;
                const opacity = 0.6;
                
                // 绘制决策边界（模拟）
                for (let i = 0; i < resolution; i++) {
                    for (let j = 0; j < resolution; j++) {
                        const x = xMin + (i / resolution) * (xMax - xMin);
                        const y = yMin + (j / resolution) * (yMax - yMin);
                        
                        // 模拟预测结果（多分类）
                        const classPredict = this.simulatePredictMultiClass(x, y);
                        
                        const pixelX = (i / resolution) * this.outputCanvas.width;
                        const pixelY = (j / resolution) * this.outputCanvas.height;
                        
                        // 根据预测类别选择颜色
                        const colorIndex = classPredict % this.colors.length;
                        const color = this.hexToRgb(this.colors[colorIndex]);
                        
                        this.outputCtx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${opacity})`;
                        
                        this.outputCtx.fillRect(
                            pixelX, 
                            pixelY, 
                            this.outputCanvas.width / resolution + 1, 
                            this.outputCanvas.height / resolution + 1
                        );
                    }
                }
                
                // 重新绘制数据点
                this.redrawDataPoints();
            }

            // hex颜色转rgb
            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }
            
            // 模拟预测（简化版）
            simulatePredict(x, y) {
                // 简化的预测函数，实际应该调用后端API
                const centerX = (this.dataRange.xMin + this.dataRange.xMax) / 2;
                const centerY = (this.dataRange.yMin + this.dataRange.yMax) / 2;
                const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                return 1 / (1 + Math.exp(-dist + 1)); // sigmoid-like function
            }
            
            // 模拟多分类预测
            simulatePredictMultiClass(x, y) {
                if (!this.currentData || !this.currentData.y) return 0;
                
                const centerX = (this.dataRange.xMin + this.dataRange.xMax) / 2;
                const centerY = (this.dataRange.yMin + this.dataRange.yMax) / 2;
                
                // 获取所有类别
                const uniqueLabels = [...new Set(this.currentData.y)];
                const numClasses = uniqueLabels.length;
                
                if (numClasses <= 2) {
                    // 二分类
                    return x > centerX ? uniqueLabels[1] : uniqueLabels[0];
                } else if (numClasses <= 4) {
                    // 3-4类：使用象限分割
                    let classIndex;
                    if (x >= centerX && y >= centerY) classIndex = 0; // 右上
                    else if (x < centerX && y >= centerY) classIndex = 1; // 左上
                    else if (x < centerX && y < centerY) classIndex = 2; // 左下
                    else classIndex = 3; // 右下
                    
                    return uniqueLabels[Math.min(classIndex, numClasses - 1)];
                } else {
                    // 5类以上：使用更复杂的径向分割
                    const angle = Math.atan2(y - centerY, x - centerX);
                    const distance = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                    const normalizedAngle = (angle + Math.PI) / (2 * Math.PI); // 0-1
                    
                    // 结合角度和距离进行分类
                    let classIndex;
                    if (distance < 0.3 * Math.max(this.dataRange.xMax - this.dataRange.xMin, this.dataRange.yMax - this.dataRange.yMin)) {
                        // 中心区域
                        classIndex = 0;
                    } else {
                        // 外围区域按角度分割
                        classIndex = 1 + Math.floor(normalizedAngle * (numClasses - 1));
                    }
                    
                    return uniqueLabels[Math.min(classIndex, numClasses - 1)];
                }
            }

            // 绘制loss曲线图
            drawLossChart(ctx, canvas) {
                // 清空画布
                ctx.fillStyle = '#F8FAFD';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (!this.trainingHistory || this.trainingHistory.length === 0) return;
                
                const margin = { top: 20, right: 20, bottom: 40, left: 60 };
                const chartWidth = canvas.width - margin.left - margin.right;
                const chartHeight = canvas.height - margin.top - margin.bottom;
                
                // 提取数据
                const iterations = this.trainingHistory.map(h => h.iteration);
                const trainLosses = this.trainingHistory.map(h => h.train_loss || 0);
                const testLosses = this.trainingHistory.map(h => h.test_loss || 0);
                
                // 计算范围
                const maxIteration = Math.max(...iterations);
                const minLoss = Math.min(...trainLosses, ...testLosses);
                const maxLoss = Math.max(...trainLosses, ...testLosses);
                const lossRange = maxLoss - minLoss;
                
                // 绘制坐标轴
                ctx.strokeStyle = '#172033';
                ctx.lineWidth = 1;
                ctx.beginPath();
                // Y轴
                ctx.moveTo(margin.left, margin.top);
                ctx.lineTo(margin.left, margin.top + chartHeight);
                // X轴
                ctx.moveTo(margin.left, margin.top + chartHeight);
                ctx.lineTo(margin.left + chartWidth, margin.top + chartHeight);
                ctx.stroke();
                
                // 绘制网格
                ctx.strokeStyle = '#DCE4EE';
                ctx.lineWidth = 1;
                const gridLines = 5;
                
                // 垂直网格线
                for (let i = 1; i < gridLines; i++) {
                    const x = margin.left + (i * chartWidth / gridLines);
                    ctx.beginPath();
                    ctx.moveTo(x, margin.top);
                    ctx.lineTo(x, margin.top + chartHeight);
                    ctx.stroke();
                }
                
                // 水平网格线
                for (let i = 1; i < gridLines; i++) {
                    const y = margin.top + (i * chartHeight / gridLines);
                    ctx.beginPath();
                    ctx.moveTo(margin.left, y);
                    ctx.lineTo(margin.left + chartWidth, y);
                    ctx.stroke();
                }
                
                // 处理除零错误
                const safeLossRange = lossRange > 0 ? lossRange : 1;
                
                // 绘制训练loss曲线
                if (trainLosses.length > 0) {
                    ctx.strokeStyle = '#4F46E5';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    
                    trainLosses.forEach((loss, i) => {
                        const x = margin.left + (iterations[i] / maxIteration) * chartWidth;
                        const y = margin.top + chartHeight - ((loss - minLoss) / safeLossRange) * chartHeight;
                        
                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    
                    ctx.stroke();
                }
                
                // 绘制测试loss曲线
                if (testLosses.length > 0) {
                    ctx.strokeStyle = '#ff6b6b';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    
                    testLosses.forEach((loss, i) => {
                        const x = margin.left + (iterations[i] / maxIteration) * chartWidth;
                        const y = margin.top + chartHeight - ((loss - minLoss) / safeLossRange) * chartHeight;
                        
                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    
                    ctx.stroke();
                }
                
                // 绘制坐标轴标签
                ctx.fillStyle = '#172033';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                
                // X轴标签
                for (let i = 0; i <= 4; i++) {
                    const iteration = Math.round((i / 4) * maxIteration);
                    const x = margin.left + (i / 4) * chartWidth;
                    ctx.fillText(iteration.toString(), x, margin.top + chartHeight + 20);
                }
                
                // Y轴标签
                ctx.textAlign = 'right';
                for (let i = 0; i <= 4; i++) {
                    const loss = minLoss + (i / 4) * safeLossRange;
                    const y = margin.top + chartHeight - (i / 4) * chartHeight;
                    ctx.fillText(loss.toFixed(3), margin.left - 10, y + 4);
                }
                
                // 轴标题
                ctx.textAlign = 'center';
                ctx.fillText('迭代次数', margin.left + chartWidth / 2, canvas.height - 5);
                
                ctx.save();
                ctx.translate(15, margin.top + chartHeight / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillText('损失值', 0, 0);
                ctx.restore();
            }

                            neuron.setAttribute('data-neuron-index', i);
                            outputLayer.appendChild(neuron);
                        }
                        layers.push({ size: outputSize, element: outputLayer, displayed: maxOutputDisplay });

                    container.appendChild(outputLayer);

                setTimeout(() => {
                    this.drawConnections(layers);
