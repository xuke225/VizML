                // 计算并显示网络参数统计
                this.calculateAndDisplayNetworkStats(layers);
            }
            
            // 计算并显示网络参数统计
            calculateAndDisplayNetworkStats(layers) {
                if (layers.length < 2) return;
                
                let totalParams = 0;
                let totalFLOPs = 0;
                let layerDetails = [];
                
                // 计算每层的参数量和计算量
                for (let i = 0; i < layers.length - 1; i++) {
                    const currentLayerSize = layers[i].size;
                    const nextLayerSize = layers[i + 1].size;
                    
                    // 权重参数 = 当前层神经元数 × 下一层神经元数
                    const weights = currentLayerSize * nextLayerSize;
                    // 偏置参数 = 下一层神经元数
                    const biases = nextLayerSize;
                    // 该层总参数
                    const layerParams = weights + biases;
                    
                    // 前向传播计算量（FLOPs）：矩阵乘法 + 激活函数
                    // 矩阵乘法：2 * 输入 * 输出（乘法和加法）
                    // 激活函数：1 * 输出
                    const layerFLOPs = (2 * currentLayerSize * nextLayerSize) + nextLayerSize;
                    
                    totalParams += layerParams;
                    totalFLOPs += layerFLOPs;
                    
                    layerDetails.push({
                        layer: i + 1,
                        from: currentLayerSize,
                        to: nextLayerSize,
                        weights: weights,
                        biases: biases,
                        totalParams: layerParams,
                        flops: layerFLOPs
                    });
                }
                
                // 显示统计信息
                this.displayNetworkStats(totalParams, totalFLOPs, layerDetails);
            }
            
            // 显示网络参数统计
            displayNetworkStats(totalParams, totalFLOPs, layerDetails) {
                const statsContainer = document.getElementById('networkStats');
                const statsContent = document.getElementById('networkStatsContent');
                
                if (!statsContainer || !statsContent) return;
                
                // 格式化数字显示
                const formatNumber = (num) => {
                    if (num >= 1000000) {
                        return (num / 1000000).toFixed(1) + 'M';
                    } else if (num >= 1000) {
                        return (num / 1000).toFixed(1) + 'K';
                    }
                    return num.toString();
                };
                
                let html = '';
                
                // 总体统计
                html += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <div style="flex: 1;">
                            <div style="font-weight: bold; color: #44516A;">总参数量: <span style="color: #4F46E5;">${formatNumber(totalParams)}</span></div>
                            <div style="font-weight: bold; color: #44516A;">计算量: <span style="color: #ff6b6b;">${formatNumber(totalFLOPs)} FLOPs</span></div>
                        </div>
                    </div>
                `;
                
                // 详细分层信息
                if (layerDetails.length > 0) {
                    html += '<div style="border-top: 1px solid #ddd; padding-top: 8px; margin-top: 8px;">';
                    html += '<div style="font-weight: bold; margin-bottom: 4px; color: #44516A;">分层详情:</div>';
                    
                    layerDetails.forEach((layer, index) => {
                        const layerName = index === 0 ? '输入→隐藏1' : 
                                         index === layerDetails.length - 1 ? `隐藏${index}→输出` : 
                                         `隐藏${index}→隐藏${index + 1}`;
                        
                        html += `
                            <div style="margin-bottom: 2px; display: flex; justify-content: space-between;">
                                <span style="font-size: 10px;">${layerName} (${layer.from}→${layer.to}):</span>
                                <span style="font-size: 10px; color: #4F46E5;">${formatNumber(layer.totalParams)}参数</span>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }
                
                statsContent.innerHTML = html;
                statsContainer.style.display = 'block';
            }
            
            // 绘制神经元之间的连接线
            drawConnections(layers) {
                const svg = document.getElementById('networkConnections');
                svg.innerHTML = '';
                
                if (layers.length < 2) return;
                
                // 获取容器尺寸
                const containerRect = document.getElementById('networkCanvas').getBoundingClientRect();
                
                for (let i = 0; i < layers.length - 1; i++) {
                    const currentLayer = layers[i];
                    const nextLayer = layers[i + 1];
                    
                    const currentNeurons = currentLayer.element.querySelectorAll('.neuron');
                    const nextNeurons = nextLayer.element.querySelectorAll('.neuron');
                    
                    // 为每个当前层神经元连接到下一层的每个神经元
                    currentNeurons.forEach((currentNeuron, currentIdx) => {
                        // 跳过省略标记
                        if (currentNeuron.getAttribute('data-neuron-index') === 'ellipsis') return;
                        
                        nextNeurons.forEach((nextNeuron, nextIdx) => {
                            // 跳过省略标记
                            if (nextNeuron.getAttribute('data-neuron-index') === 'ellipsis') return;
                            
                            const currentRect = currentNeuron.getBoundingClientRect();
                            const nextRect = nextNeuron.getBoundingClientRect();
                            const containerRect = svg.getBoundingClientRect();
                            
                            // 计算相对于SVG容器的坐标
                            const x1 = currentRect.left + currentRect.width / 2 - containerRect.left;
                            const y1 = currentRect.top + currentRect.height / 2 - containerRect.top;
                            const x2 = nextRect.left + nextRect.width / 2 - containerRect.left;
                            const y2 = nextRect.top + nextRect.height / 2 - containerRect.top;
                            
                            // 创建连接线
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', x1);
                            line.setAttribute('y1', y1);
                            line.setAttribute('x2', x2);
                            line.setAttribute('y2', y2);
                            line.setAttribute('class', 'connection');
                            
                            svg.appendChild(line);
                        });
                    });
                }
            }
            
            // 启动训练动画
            startTrainingAnimation() {
                const networkCanvas = document.getElementById('networkCanvas');
                const networkLayers = document.getElementById('networkLayers');
                networkCanvas.classList.add('training');
                networkLayers.classList.add('training');
                
                // 模拟训练进度
                let progress = 0;
                this.trainingInterval = setInterval(() => {
                    if (!this.isTraining) {
                        clearInterval(this.trainingInterval);
                        return;
                    }
                    
                    progress += Math.random() * 10;
                    progress = Math.min(progress, 100);
                    
                    document.getElementById('progressFill').style.width = progress + '%';
                    
                    // 模拟损失下降
                    const currentLoss = Math.max(0.001, 1.0 - (progress / 100) * 0.8 + Math.random() * 0.1);
                    const currentAcc = Math.min(99, progress * 0.9 + Math.random() * 10);
                    
                    document.getElementById('lossValue').textContent = currentLoss.toFixed(3);
                    document.getElementById('accuracyValue').textContent = currentAcc.toFixed(1) + '%';
                    document.getElementById('epochValue').textContent = Math.floor(progress * this.networkConfig.max_iter / 100);
                }, 200);
            }
            
            // 停止训练动画
            stopTrainingAnimation() {
                const networkCanvas = document.getElementById('networkCanvas');
                const networkLayers = document.getElementById('networkLayers');
                networkCanvas.classList.remove('training');
                networkLayers.classList.remove('training');
                
                if (this.trainingInterval) {
                    clearInterval(this.trainingInterval);
                }
            }
            
            // 清空画布
            clearCanvas(ctx, canvas) {
                ctx.fillStyle = '#F8FAFD';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制网格
                ctx.strokeStyle = '#E7EDF5';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 10; i++) {
                    const x = (i / 10) * canvas.width;
                    const y = (i / 10) * canvas.height;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
            
            // 重置所有
            resetAll() {
                this.currentSessionKey = null;
                this.currentModelKey = null;
                this.currentData = null;
                this.mlpModel = null;
                this.isTraining = false;
                this.trainingHistory = [];
                this.trainTestInfo = null;
                
                // 重置数据显示模式
                document.getElementById('showAllData').checked = true;
                this.dataDisplayMode = 'all';
                
                // 停止实时训练
                this.stopRealtimeTraining();
                
                // 重置显示
                document.getElementById('epochValue').textContent = '0';
                document.getElementById('lossValue').textContent = '0.000';
                document.getElementById('accuracyValue').textContent = '0%';
                document.getElementById('testLossValue').textContent = '0.000';
                document.getElementById('testAccuracyValue').textContent = '0%';
                document.getElementById('progressFill').style.width = '0%';
                
                // 隐藏训练统计和loss图表
                document.getElementById('trainingStats').style.display = 'none';
                document.getElementById('compactLossChart').style.display = 'none';
                document.getElementById('dataLegend').style.display = 'none';
                document.getElementById('networkStats').style.display = 'none';
                this.hideExportOptions();
                
                // 重置按钮
                document.getElementById('realtimeTrainBtn').disabled = true;
                document.getElementById('stopTrainBtn').disabled = true;
                
                // 清空画布
                this.clearCanvas(this.dataCtx, this.dataCanvas);
                this.clearCanvas(this.outputCtx, this.outputCanvas);
                
                // 停止动画
                this.stopTrainingAnimation();
                
                // 停止边界动画
                if (this.boundaryAnimation) {
                    clearInterval(this.boundaryAnimation);
                    this.boundaryAnimation = null;
                }
                
                this.updateStatus('已重置所有数据');
            }
            
            // 开始实时训练
            async startRealtimeTraining() {
                if (!this.currentSessionKey) {
                    alert('请先生成数据！');
                    return;
                }
                
                if (this.isRealtimeTraining) {
                    return; // 已在训练中
                }
                
                try {
                    this.isRealtimeTraining = true;
                    this.realtimeStep = 1;
                    
                    // 更新按钮状态
                    document.getElementById('realtimeTrainBtn').disabled = true;
                    document.getElementById('stopTrainBtn').disabled = false;
                    
                    // 显示训练统计面板
                    document.getElementById('trainingStats').style.display = 'block';
                    document.getElementById('compactLossChart').style.display = 'block';
                    
                    this.updateStatus('开始实时训练...');
                    this.startTrainingAnimation();
                    
                    // 开始分步训练
                    this.performRealtimeTrainingStep();
                    
                } catch (error) {
                    console.error('实时训练启动失败:', error);
                    this.stopRealtimeTraining();
                    this.updateStatus('实时训练启动失败: ' + error.message);
                }
            }
            
            // 执行实时训练步骤
            async performRealtimeTrainingStep() {
                if (!this.isRealtimeTraining) return;
                
                try {
                    const params = {
                        network_type: this.networkConfig.network_type,
                        activation: this.networkConfig.activation,
                        solver: this.networkConfig.solver,
                        learning_rate_init: this.networkConfig.learning_rate_init,
                        max_iter: this.networkConfig.max_iter,
                        alpha: this.networkConfig.alpha,
                        test_size: 0.2,
                        random_state: 42
                    };
                    
                    // 只有多层感知机才需要隐藏层配置
                    if (this.networkConfig.network_type === 'mlp') {
                        const hiddenSizes = this.networkConfig.hidden_layer_sizes.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
                        params.hidden_layer_sizes = hiddenSizes;
                    }
                    
                    const config = {
                        session_key: this.currentSessionKey,
                        step: this.realtimeStep,
                        params: params
                    };
                    
                    const result = await this.apiClient.trainNeuralNetworkStep(config);
                    
                    if (result.status === 'success') {
                        // 第一次训练时，获取训练测试分割信息
                        if (this.realtimeStep === 1 && !this.trainTestInfo) {
                            // 从API获取训练测试数据分割信息
                            this.trainTestInfo = {
                                X_train: [], // 将在后续的API调用中获取
                                y_train: [],
                                X_test: [],
                                y_test: []
                            };
                            
                            // 模拟训练测试分割（80-20分割）
                            const X = this.currentData.X;
                            const y = this.currentData.y;
                            const testSize = 0.2;
                            const splitIndex = Math.floor(X.length * (1 - testSize));
                            
                            // 简单的顺序分割（实际项目中应该使用随机分割）
                            this.trainTestInfo.X_train = X.slice(0, splitIndex);
                            this.trainTestInfo.y_train = y.slice(0, splitIndex);
                            this.trainTestInfo.X_test = X.slice(splitIndex);
                            this.trainTestInfo.y_test = y.slice(splitIndex);
                            
                            // 重新绘制数据可视化
                            this.visualizeData();
                        }
                        
                        // 更新训练历史
                        this.trainingHistory = result.training_history || [];
                        
                        // 更新统计信息
                        const metrics = result.metrics;
                        document.getElementById('epochValue').textContent = result.current_iter;
                        document.getElementById('lossValue').textContent = metrics.train_loss.toFixed(3);
                        document.getElementById('accuracyValue').textContent = (metrics.train_accuracy * 100).toFixed(1) + '%';
                        document.getElementById('testLossValue').textContent = metrics.test_loss.toFixed(3);
                        document.getElementById('testAccuracyValue').textContent = (metrics.test_accuracy * 100).toFixed(1) + '%';
                        
                        // 更新进度条
                        const progress = (result.current_iter / result.max_iter) * 100;
                        document.getElementById('progressFill').style.width = progress + '%';
                        
                        // 更新损失图表
                        if (this.trainingHistory.length > 0) {
                            const canvas = document.getElementById('compactLossCanvas');
                            const ctx = canvas.getContext('2d');
                            this.drawLossChart(ctx, canvas);
                        }
                        
                        // 更新决策边界（如果有边界数据）
                        if (result.boundary_data) {
                            this.drawDecisionBoundary(result.boundary_data);
                        }
                        
                        // 检查是否完成
                        if (result.is_finished) {
                            this.currentModelKey = `neural_network_${this.currentSessionKey}`;
                            this.stopRealtimeTraining();
                            this.showExportOptions(); // 显示导出选项
                            this.updateStatus('实时训练完成');
                        } else {
                            // 继续下一步
                            this.realtimeStep++;
                            this.realtimeInterval = setTimeout(() => {
                                this.performRealtimeTrainingStep();
                            }, 1000); // 每秒一步
                        }
                        
                    } else {
                        throw new Error(result.message);
                    }
                    
                } catch (error) {
                    console.error('实时训练步骤失败:', error);
                    this.stopRealtimeTraining();
                    this.updateStatus('实时训练失败: ' + error.message);
                }
            }
            
            // 停止实时训练
            stopRealtimeTraining() {
                this.isRealtimeTraining = false;
                
                if (this.realtimeInterval) {
                    clearTimeout(this.realtimeInterval);
                    this.realtimeInterval = null;
                }
                
                // 更新按钮状态
                document.getElementById('realtimeTrainBtn').disabled = false;
                document.getElementById('stopTrainBtn').disabled = true;
                
                // 停止训练动画
                this.stopTrainingAnimation();
                
                this.updateStatus('实时训练已停止');
            }
            
            // 更新状态
            updateStatus(message) {
                console.log('状态:', message);
            }
            
            // 导出决策边界图像
            exportDecisionBoundaryImage() {
                try {
                    const canvas = this.outputCanvas;
                    const dataURL = canvas.toDataURL('image/png');
                    
                    const link = document.createElement('a');
                    link.download = `neural_network_decision_boundary_${new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-')}.png`;
                    link.href = dataURL;
                    link.click();
                    
                    this.updateStatus('决策边界图像已导出');
                } catch (error) {
                    console.error('导出图像失败:', error);
                    this.updateStatus('导出图像失败: ' + error.message);
                }
            }
            
            // 导出训练数据
            exportTrainingData() {
                try {
                    if (!this.currentData) {
                        alert('没有可导出的数据');
                        return;
                    }
                    
                    const exportData = {
                        metadata: {
                            export_time: new Date().toISOString(),
                            dataset_type: this.datasetConfig.type,
                            n_samples: this.datasetConfig.n_samples,
                            noise: this.datasetConfig.noise,
                            data_range: this.dataRange
                        },
                        data: {
                            X: this.currentData.X,
                            y: this.currentData.y,
                            n_classes: this.currentData.n_classes,
                            n_samples: this.currentData.n_samples
                        },
                        train_test_split: this.trainTestInfo || null
                    };
                    
                    const jsonStr = JSON.stringify(exportData, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.download = `neural_network_data_${new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-')}.json`;
                    link.href = url;
                    link.click();
                    
                    URL.revokeObjectURL(url);
                    this.updateStatus('训练数据已导出');
                } catch (error) {
                    console.error('导出数据失败:', error);
                    this.updateStatus('导出数据失败: ' + error.message);
                }
            }
            
            // 导出训练历史
            exportTrainingHistory() {
                try {
                    if (!this.trainingHistory || this.trainingHistory.length === 0) {
                        alert('没有可导出的训练历史');
                        return;
                    }
                    
                    // 创建CSV格式的训练历史
                    const headers = Object.keys(this.trainingHistory[0]);
                    let csvContent = headers.join(',') + '\n';
                    
                    this.trainingHistory.forEach(row => {
                        const values = headers.map(header => row[header] || '');
                        csvContent += values.join(',') + '\n';
                    });
                    
                    const blob = new Blob([csvContent], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.download = `neural_network_training_history_${new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-')}.csv`;
                    link.href = url;
                    link.click();
                    
                    URL.revokeObjectURL(url);
                    this.updateStatus('训练历史已导出');
                } catch (error) {
                    console.error('导出训练历史失败:', error);
                    this.updateStatus('导出训练历史失败: ' + error.message);
                }
            }
            
            // 导出模型信息
            exportModelInfo() {
                try {
                    if (!this.currentModelKey) {
                        alert('没有可导出的模型信息');
                        return;
                    }
                    
                    const modelInfo = {
                        metadata: {
                            export_time: new Date().toISOString(),
                            model_key: this.currentModelKey,
                            session_key: this.currentSessionKey
                        },
                        network_config: this.networkConfig,
                        training_config: {
                            dataset_type: this.datasetConfig.type,
                            n_samples: this.datasetConfig.n_samples,
                            noise: this.datasetConfig.noise
                        },
                        training_results: {
                            final_metrics: this.trainingHistory && this.trainingHistory.length > 0 ? 
                                this.trainingHistory[this.trainingHistory.length - 1] : null,
                            total_epochs: this.trainingHistory ? this.trainingHistory.length : 0,
                            convergence_status: 'completed'
                        },
                        network_structure: this.getNetworkStructureInfo()
                    };
                    
                    const jsonStr = JSON.stringify(modelInfo, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.download = `neural_network_model_${new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-')}.json`;
                    link.href = url;
                    link.click();
                    
                    URL.revokeObjectURL(url);
                    this.updateStatus('模型信息已导出');
                } catch (error) {
                    console.error('导出模型信息失败:', error);
                    this.updateStatus('导出模型信息失败: ' + error.message);
                }
            }
            
            // 获取网络结构信息
            getNetworkStructureInfo() {
                const hiddenSizes = this.networkConfig.hidden_layer_sizes ? 
                    this.networkConfig.hidden_layer_sizes.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x)) : [];
                
                const layers = [
                    { type: 'input', size: 2, activation: 'none' },
                    ...hiddenSizes.map((size, i) => ({ type: 'hidden', size: size, activation: this.networkConfig.activation, layer_index: i })),
                    { type: 'output', size: this.currentData ? this.currentData.n_classes || 1 : 1, activation: 'softmax' }
                ];
                
                // 计算参数总量
                let totalParams = 0;
                for (let i = 0; i < layers.length - 1; i++) {
                    const weights = layers[i].size * layers[i + 1].size;
                    const biases = layers[i + 1].size;
                    totalParams += weights + biases;
                }
                
                return {
                    layers: layers,
                    total_layers: layers.length,
                    total_parameters: totalParams,
                    network_type: this.networkConfig.network_type,
                    activation_function: this.networkConfig.activation,
                    solver: this.networkConfig.solver
                };
            }
            
            // 显示导出选项
            showExportOptions() {
                document.getElementById('exportSection').style.display = 'block';
            }
            
            // 隐藏导出选项
            hideExportOptions() {
                document.getElementById('exportSection').style.display = 'none';
            }
        }
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new NeuralNetworkPlayground();
        });
    </script>
